<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Fixed Comment Box (XSS Prevention)</title>
<style>
  body { font-family: sans-serif; max-width: 500px; margin: 40px auto; }
  #comments div { border: 1px solid #ccc; padding: 8px; margin: 6px 0; border-radius: 4px; }
  textarea { width: 100%; height: 60px; }
</style>
</head>
<body>
  <h2>✅ Comment Box (Fixed)</h2>
  <p>Input yang sama sekarang aman — akan tampil sebagai teks biasa, bukan dieksekusi.</p>

  <textarea id="commentInput" placeholder="Tulis komentar..."></textarea><br>
  <button onclick="addComment()">Kirim</button>

  <div id="comments"></div>

  <script>
    function addComment() {
      const input = document.getElementById('commentInput').value;
      const commentsDiv = document.getElementById('comments');

      // ✅ FIXED cara 1: textContent otomatis escape, tidak pernah dieksekusi sebagai HTML
      const div = document.createElement('div');
      div.textContent = input;
      commentsDiv.appendChild(div);

      document.getElementById('commentInput').value = '';
    }

    // ✅ FIXED cara 2 (kalau terpaksa pakai innerHTML): escape manual
    function escapeHtml(str) {
      const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
      return str.replace(/[&<>"']/g, (c) => map[c]);
    }
  </script>
</body>
</html>
